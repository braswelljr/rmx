name: rmx
synopsis: |
    Remove (unlink) files and directories — a cross-platform drop-in for rm.
description: |-
    rmx removes each FILE. By default it does not remove directories; use -r to
    remove a directory and everything under it, or -d to remove an empty directory.
usage: rmx [OPTION]... [FILE]... [flags]
options:
    - name: dir
      shorthand: d
      default_value: "false"
      usage: remove empty directories
    - name: force
      shorthand: f
      default_value: "false"
      usage: ignore nonexistent files and arguments, never prompt
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for rmx
    - name: interactive
      usage: 'prompt according to WHEN: never, once, or always'
    - name: no-preserve-root
      default_value: "false"
      usage: do not treat '/' specially
    - name: one-file-system
      default_value: "false"
      usage: |
        when removing recursively, skip directories on a different file system
    - name: preserve-root
      default_value: "true"
      usage: do not remove '/' (default)
    - name: prompt-each
      shorthand: i
      default_value: "false"
      usage: prompt before every removal
    - name: prompt-once
      shorthand: I
      default_value: "false"
      usage: |
        prompt once before removing more than three files, or when removing recursively
    - name: recursive
      shorthand: r
      default_value: "false"
      usage: remove directories and their contents recursively
    - name: recursive-upper
      shorthand: R
      default_value: "false"
      usage: equivalent to -r
    - name: verbose
      shorthand: v
      default_value: "false"
      usage: explain what is being done
    - name: version
      default_value: "false"
      usage: output version information and exit
